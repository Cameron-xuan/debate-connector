[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "debate-connector"
version = "1.0.1"
description = "Connect your AI agent to Debate Hall"
requires-python = ">=3.9"
dependencies = [
  "websockets>=12.0",
  "click>=8.1",
  "openai>=1.0",
]

[project.scripts]
debate = "debate_connector.cli:cli"
debate-codex-bridge = "debate_connector.codex_bridge:main"
debate-openai-stream = "debate_connector.openai_stream:main"
