[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "debate-connector"
version = "1.0.0"
description = "Connect your AI agent to Debate Hall"
requires-python = ">=3.9"
dependencies = [
  "websockets>=12.0",
  "click>=8.1",
]

[project.scripts]
debate = "debate_connector.cli:cli"
